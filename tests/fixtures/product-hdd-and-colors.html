<div class="thumbnail" itemscope itemtype="https://schema.org/Product">
  <div class="product-wrapper card-body">
    <div class="row">
      <div class="col-xl-10">
        <div class="caption">
          <h4 class="price float-end pull-right" itemprop="offers" itemscope itemtype="https://schema.org/Offer">
            <span itemprop="price">$587.99</span>
            <meta itemprop="priceCurrency" content="USD">
          </h4>
          <h4 class="title card-title" itemprop="name">Galaxy Note 10.1</h4>
          <p class="description card-text" itemprop="description">10.1&quot;, 32GB, Black</p>
        </div>
        <div class="dropdown">
          <select aria-label="color">
            <option class="dropdown-item" value="">Select color</option>
            <option class="dropdown-item" value="Gold">Gold</option>
            <option class="dropdown-item" value="White">White</option>
            <option class="dropdown-item" value="Black">Black</option>
          </select>
        </div>
        <label class="memory">HDD:</label>
        <div class="swatches">
          <button type="button" class="btn swatch btn-primary active" value="128">128</button>
          <button type="button" class="btn swatch" value="256">256</button>
          <button type="button" class="btn swatch" value="512">512</button>
          <button type="button" class="btn swatch" value="1024" disabled>1024</button>
        </div>
      </div>
    </div>
  </div>
</div>
